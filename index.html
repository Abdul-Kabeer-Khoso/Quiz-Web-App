<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="Configuration_container">

            <h2 class="title">Quiz Configuration</h2>

            <h3 class="slt_category">Select Category</h3>

            <div class="categories_options">

                <div class="row1">
                    <div class="cat1 Category">Programming</div>
                    <div class="cat2 Category">Cricket</div>
                </div>

                <div class="row2">
                    <div class="cat3 Category">G.k</div>
                    <div class="cat4 Category">Football</div>
                </div>    

            </div>

            <h3 class="num_of_questions">Number of Questions</h3>

            <div class="questionNumber">
                    <div class="questionNumberOption">5</div>
                    <div class="questionNumberOption">10</div>
                    <div class="questionNumberOption">15</div>
                    <div class="questionNumberOption">20</div>
                    <div class="questionNumberOption">25</div>
            </div>

            <button class="startBtn">Start</button>

    </div>

    <script src="quiz-configuration.js"></script>  
    <script src="script.js"></script>
</body>
</html>
